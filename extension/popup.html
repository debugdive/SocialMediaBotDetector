<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; width: 300px; padding: 15px; background: #fafafa;}
        h3 { margin-top: 0; color: #E1306C; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: none;}
        button { background: #0095f6; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer;}
        button:hover { background: #1877f2; }
        #result { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <h3>📰 Fake News Scanner</h3>
    <p style="font-size: 12px; color: gray;">Copy & paste any news story, tweet, or article here to verify it.</p>
    
    <textarea id="newsText" placeholder="Paste information here..."></textarea>
    <button id="scanBtn">Verify Information</button>
    
    <div id="result"></div>

    <script>
        document.getElementById('scanBtn').onclick = function() {
            const text = document.getElementById('newsText').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerText = "Scanning...";
            resultDiv.style.color = "black";
            
            fetch("http://127.0.0.1:5000/api/scan_info", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: text})
            })
            .then(res => res.json())
            .then(data => {
                resultDiv.innerText = data.message;
                if(data.status === 'danger') {
                    resultDiv.style.color = "red";
                } else {
                    resultDiv.style.color = "green";
                }
            }).catch(err => {
                resultDiv.innerText = "Error: Backend is offline.";
                resultDiv.style.color = "gray";
            });
        };
    </script>
</body>
</html>
